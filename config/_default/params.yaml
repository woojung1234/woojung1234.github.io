# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance - Clean and Modern Design
appearance:
  theme_day: minimal
  theme_night: minimal
  font: minimal
  font_size: L

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: '김우중 - AI & Data Developer'
    description: '전북대학교 통계학과 4학년, AI와 데이터를 활용한 실생활 문제 해결에 특화된 개발자 김우중의 포트폴리오입니다.'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

# Site header - Clean Navigation
header:
  navbar:
    enable: true
    align: c
    show_logo: false
    show_language: false
    show_day_night: true
    show_search: false
    highlight_active_link: true

# Footer - Minimal Design
footer:
  copyright:
    notice: '© 2025 김우중. All rights reserved.'

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features - Optimized for Portfolio
features:
  syntax_highlighter:
    enable: true
    extra_languages:
      - r
      - latex
      - python
      - javascript
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/woojung1234/woojung1234.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
  search:
    provider: ''
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions
extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true